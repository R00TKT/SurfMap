[package]
name = "SurfMap"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Web crawler and attack-surface mapper"
readme = "README.md"
license = "MIT"
keywords = ["crawler", "security", "attack-surface", "web", "scanner"]
categories = ["command-line-utilities"]
publish = false

# The package is SurfMap, but the crate everything imports is snake_case.
[lib]
name = "surfmap"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
dashmap = "6.2.1"
form_urlencoded = "1.2.2"
governor = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "charset", "gzip", "brotli"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
form_urlencoded = "1.2.2"
proptest = "1.11.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true